name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Compile
        run: >
          dotnet publish "PHN16S-71-98RF Refresh Rate Enabler.csproj"
          -c Release
          -r win-x64
          --self-contained false
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -o dist

      - uses: actions/upload-artifact@v4
        with:
          name: PHN16S-71-98RF Refresh Rate Enabler
          path: dist/PHN16S-71-98RF Refresh Rate Enabler.exe

      - name: Publish v1.0.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $exe = "dist/PHN16S-71-98RF Refresh Rate Enabler.exe"
          $exists = $false
          gh release view v1.0.0 *> $null
          if ($LASTEXITCODE -eq 0) { $exists = $true }
          if (-not $exists) {
            gh release create v1.0.0 $exe --title "v1.0.0" --notes "First release of the PHN16S-71-98RF Refresh Rate Enabler. Requires the .NET 10 desktop runtime."
          } else {
            gh release upload v1.0.0 $exe --clobber
          }
